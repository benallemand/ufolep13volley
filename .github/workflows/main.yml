name: CI/CD Workflow

on:
  workflow_dispatch:  # Déclenchement manuel
  push:
    tags:
      - '*'  # Se déclenche sur n'importe quel tag

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')  # Exécute uniquement si déclenché par un tag
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend bundle
        # Produit dist/ : pages .html + JS/CSS minifies + hashes + manifest.json.
        # Necessaire car le rewrite .htaccess sert les pages depuis /dist/.
        # Le dist/ n'est pas versionne.
        run: npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ftp.cluster020.hosting.ovh.net >> ~/.ssh/known_hosts

      - name: Sync frontend bundle to OVH
        # rsync AVANT le git pull pour que dist/ soit en place quand le
        # nouveau code source (HTML/PHP) commence a y faire reference.
        # --delete pour purger les vieux fichiers hashes du build precedent.
        run: |
          rsync -avz --delete dist/ ufolepvocb@ftp.cluster020.hosting.ovh.net:www/dist/

      - name: Deploy source code (git pull on OVH)
        # composer.phar et .ovhconfig vivent sur le serveur sans etre forcement
        # versionnes. Des qu'un fichier de ce genre entre dans le depot, le
        # `git pull` avorte sur « untracked working tree files would be
        # overwritten by merge » et le deploiement echoue.
        #
        # Pour chacun : s'il est deja suivi, on annule la derive locale ; sinon
        # on l'efface pour laisser le pull poser la version du depot. C'est le
        # traitement qu'avait deja composer.phar, generalise a la liste.
        #
        # .ovhconfig porte la version PHP : pendant le pull, le site retombe
        # quelques centiemes de seconde sur la version globale de l'hebergement.
        run: |
          ssh ufolepvocb@ftp.cluster020.hosting.ovh.net 'cd www && for f in composer.phar .ovhconfig; do if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then git checkout -- "$f"; else rm -f "$f"; fi; done && git pull'
          echo "Deployment completed successfully!"
