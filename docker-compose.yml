services:
  # Reverse proxy avec HTTPS automatique (Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
      - mailpit

  # Application PHP/Apache
  php:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Pas de bind mount du code : il est embarqué dans l'image (COPY du
      # Dockerfile). Le partage de fichiers Windows→VM de Docker Desktop est
      # instable en continu (wedge de la VM) — après une modif de code, il faut
      # donc rebuilder : docker compose up -d --build
      # (le mode dev garde le live-reload via docker-compose.dev.yml)
      # phpdotenv lit un fichier .env sur le disque — on monte .env.docker comme .env
      - ./.env.docker:/var/www/html/.env:ro
      # Données hors image (uploads, exclus de git et du .dockerignore)
      - ./players_pics:/var/www/html/players_pics
      - ./players_pics_low:/var/www/html/players_pics_low
      - ./teams_pics:/var/www/html/teams_pics
      - ./match_files:/var/www/html/match_files

  # Serveur SMTP de test : capture tous les emails au lieu de les envoyer.
  # Présent dans les DEUX modes (local et home server) — `.env.docker` pointe
  # dessus, donc aucune de ces deux instances n'envoie de vrai email.
  # La prod OVH utilise `.env.prod` (SMTP OVH) et n'est pas concernée.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      # L'UI est servie sous /mailpit et exposée par Caddy (auth basique).
      # Pas de port public : le 8025 n'est ouvert que sur la loopback, pour le
      # confort en dev (http://localhost:8025, sans mot de passe).
      - MP_WEBROOT=mailpit
    ports:
      - "127.0.0.1:8025:8025"   # Interface web (accès direct, machine locale)
      - "127.0.0.1:1025:1025"   # SMTP (php le joint par le réseau compose)

volumes:
  caddy_data:
  caddy_config: