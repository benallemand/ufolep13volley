<!DOCTYPE html>
<html data-theme="cupcake" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sondage</title>
    <link rel="stylesheet" href="./src/css/app.css">
</head>
<body>
<div id="app" class="max-w-3xl mx-auto p-6">
    <div v-if="isLoading" class="fixed inset-0 flex items-center justify-center bg-gray-800 bg-opacity-50 z-50">
        <div class="loading loading-spinner loading-lg">Loading...</div>
    </div>
    <match-menu :id-match="id_match"></match-menu>
    <match-summary :match-data="matchData"
                   @sign-match="signMatch"
                   @sign-team-sheets="signTeamSheets"></match-summary>
    <form @submit.prevent="submitForm">
        <!-- Échelle -- - = + ++, préremplie à = (issue #350) -->
        <div class="mb-4 p-4 border rounded-box bg-base-200" data-testid="survey-legend">
            <h2 class="font-bold mb-2">Comment noter ?</h2>
            <ul class="text-sm space-y-1">
                <li v-for="note in scale" :key="note.value">
                    <span class="badge badge-outline font-mono w-10 mr-2">{{ note.label }}</span>{{ note.meaning }}
                </li>
            </ul>
            <p class="text-sm mt-2">Chaque critère est à <strong>=</strong> par défaut : ne changez que ce qui mérite de l'être.</p>
        </div>
        <div class="mb-4 p-4 border flex flex-col gap-3">
            <div v-for="criterion in criteria" :key="criterion.key"
                 class="flex flex-col sm:flex-row sm:items-center gap-2">
                <span class="sm:basis-1/3 font-medium">{{ criterion.label }}</span>
                <div class="join" role="radiogroup" :aria-label="criterion.label">
                    <input v-for="note in scale" :key="note.value"
                           type="radio" class="join-item btn btn-sm w-12 font-mono"
                           :name="criterion.key" :value="note.value" :aria-label="note.label"
                           :title="note.meaning"
                           v-model.number="surveyData[criterion.key]"/>
                </div>
            </div>
        </div>
        <div class="form-group mb-4">
            <label class="block text-lg mb-2">Commentaire
                <span v-if="commentRequired" class="text-error text-sm">(obligatoire : une note est à --)</span>
                <textarea v-model="surveyData.comment" class="textarea textarea-bordered w-full"
                          :class="{'textarea-error': commentRequired && !hasComment}"
                          :required="commentRequired"
                          placeholder="Ajouter un commentaire"></textarea></label>
        </div>
        <div class="flex justify-center items-center m-4">
            <button class="btn btn-primary w-2/3" type="submit"><i class="fas fa-pencil mr-1"></i>Enregistrer
            </button>
        </div>
    </form>
</div>
<script src="./survey.js" type="module"></script>
</body>
</html>
